kind: Pod
metadata:
  name: sonarqube
spec:
  containers:
    - name: sonarscanner
      image: sonarsource/sonar-scanner-cli
      envFrom:
        - configMapRef:
            name: configmap-envvars
            optional: true
      runAsUser: 1000
      command:
        - cat
      tty: true
      workingDir: "/home/jenkins/agent"
      securityContext:
        runAsUser: 1000